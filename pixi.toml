[workspace]
authors = ["Scott Henderson"]
channels = ["conda-forge"]
description = "Notes and code to understand and successfully perform accurate 3D coordinate reference system (CRS) transformations"
name = "3D_CRS_Transformation_Resources"
platforms = ["osx-arm64","linux-64"]
version = "0.1.0"

[tasks]
serve='myst start --execute'
build='myst build --execute --html'
check-links='myst build --check-links'
pdf='myst build --pdf'
spellcheck='codespell --skip  _build,references.bib'

[dependencies]
codespell = ">=2.4.2,<3"
dask = ">=2026.3.0,<2027"
gdal = ">=3.12.3,<4"
geopandas = ">=1.1.3,<2"
ipython = ">=9.13.0,<10"
ipykernel = ">=7.2.0,<8"
jupytext = ">=1.19.2,<2"
jupyterlab-myst = ">=2.6.0,<3"
libgdal-arrow-parquet = ">=3.12.3,<4"
matplotlib = ">=3.10.9,<4"
mystmd = ">=1.9.0,<2"
xarray = ">=2026.4.0,<2027"
rioxarray = ">=0.22.0,<0.23"
cartopy = ">=0.25.0,<0.26"
